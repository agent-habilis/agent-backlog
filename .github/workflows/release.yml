name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag matches packages/agent-backlog-cli/package.json
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          manifest=$(jq -r .version packages/agent-backlog-cli/package.json)
          if [ "$tag" != "$manifest" ]; then
            echo "Tag v$tag does not match package.json version $manifest" >&2
            exit 1
          fi

  create-release:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub Release (idempotent)
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  # One runner for every target: `bun build --compile --target` cross-compiles
  # by downloading the matching Bun runtime, so there is no per-OS matrix.
  # The macOS binaries leave here with Bun's own ad-hoc signature, which macOS
  # refuses; the formula re-signs them at install time.
  build-upload:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build --all
      - name: Archive and upload one tarball per target
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd build
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            mkdir "$target"
            cp "agent-backlog-$target" "$target/agent-backlog"
            archive="agent-backlog-$TAG-$target.tar.gz"
            tar -C "$target" -czf "$archive" agent-backlog
            sha256sum "$archive" > "$archive.sha256"
            gh release upload "$TAG" "$archive" "$archive.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          done

  update-formula:
    needs: build-upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # commit the formula bump onto main, not the tag
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump Formula/agent-backlog.rb to the released version + checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ver="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir /tmp --clobber
          # perl, not `sed -i`: identical on BSD and GNU, so this step also
          # reproduces on a Mac.
          perl -pi -e "s/^  version \"[^\"]*\"/  version \"$ver\"/" Formula/agent-backlog.rb
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            sum=$(cut -d' ' -f1 "/tmp/agent-backlog-v$ver-$target.tar.gz.sha256")
            # Replace the sha256 line immediately following this target's url line.
            perl -0pi -e "s{(${target}\.tar\.gz\"\s*\n\s*sha256 \")[0-9a-f]{64}}{\${1}${sum}}g" Formula/agent-backlog.rb
          done
      - name: Commit the formula bump
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agent-backlog.rb
          git diff --cached --quiet || git commit -m "chore: update Homebrew formula for ${TAG}"
          git push origin main
      # The GITHUB_TOKEN is scoped to this repo, so mirroring into the org
      # tap needs the TAP_PUSH_TOKEN secret (fine-grained PAT, contents
      # read/write on homebrew-tap only).
      - uses: actions/checkout@v5
        with:
          repository: agent-habilis/homebrew-tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}
          path: tap
      - name: Mirror the formula to the org tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp Formula/agent-backlog.rb tap/Formula/agent-backlog.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agent-backlog.rb
          git diff --cached --quiet || git commit -m "agent-backlog ${TAG}"
          git push
